name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out exact tag commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact checked-out tag commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"
          printf 'Release validation HEAD: %s\nTag commit: %s\n' "$ACTUAL_SHA" "$TAG_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$TAG_SHA" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.19.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Validate Domain DAG
        run: npm run domain-dag
      - name: Check package contents
        run: npm run pack:check
      - name: Smoke-test package tarball
        run: npm run pack:smoke
      - name: Audit dependencies
        if: matrix.os == 'ubuntu-latest'
        run: npm run audit

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated tag commit without credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify validated publication commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          TAG_SHA="$(git rev-list -n 1 "$TAG_NAME")"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          test "$TAG_SHA" = "$EXPECTED_SHA"
      - name: Build release notes from changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const tagName = process.env.TAG_NAME;
          const version = tagName?.replace(/^v/, "");
          if (!version) throw new Error("Missing release tag name.");
          const packageJson = JSON.parse(readFileSync("package.json", "utf8"));
          if (packageJson.version !== version) {
            throw new Error(`Tag ${tagName} does not match package.json version ${packageJson.version}.`);
          }
          const changelog = readFileSync("CHANGELOG.md", "utf8");
          const escapedVersion = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const pattern = new RegExp(`^##\\s+(${escapedVersion}(?:[^\\n]*)?)\\n([\\s\\S]*?)(?=^##\\s+|(?![\\s\\S]))`, "m");
          const match = changelog.match(pattern);
          if (!match) throw new Error(`CHANGELOG.md has no section for ${version}.`);
          const title = match[1].trim();
          const notes = match[2].trim();
          if (!notes) throw new Error(`CHANGELOG.md section for ${version} is empty.`);
          writeFileSync("release-title.txt", `${title}\n`);
          writeFileSync("release-notes.md", `${notes}\n`);
          NODE
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$(cat release-title.txt)" \
            --notes-file release-notes.md \
            --verify-tag
